<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makerpods | Adult Sign Up</title>
  <link rel="stylesheet" href="Sign Up Pt 2a Adult.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/site-logo.css" />
</head>
<body>
  <div class="site-logo" aria-label="Makerpods">
    <img src="../../../assets/images/makerpods-logo.png" alt="Makerpods" class="site-logo-img">
  </div>

  <div id="gear-toggle-container" class="gear-toggle-container">
    <div class="gear-options">
      <button id="theme-toggle-btn" class="gear-option-btn" aria-label="Toggle Dark/Light Mode">
        <span id="theme-icon"></span>
      </button>
      <button id="transparency-toggle-btn" class="gear-option-btn" aria-label="Toggle Solid/Transparent Mode">
        <span id="transparency-icon"></span>
      </button>
    </div>
    <button class="gear-main-btn" aria-label="Display settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="signup-container">
    <div class="signup-header">
      <h1>Adult Sign Up</h1>
      <p>Required for adults to view kids/students of all ages experience and work</p>
    </div>

    <form id="parent-legal-form">
      <fieldset class="form-section">
        <legend>Legal Name</legend>

        <div class="form-row">
          <div class="form-group prefix-group">
            <label for="prefix-trigger">Prefix</label>
            <div class="custom-select" data-target-input="prefix">
              <button type="button" id="prefix-trigger" class="custom-select-trigger form-input" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value">--</span>
                <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
              </button>
              <div class="custom-select-menu" role="listbox">
                <button type="button" class="custom-select-option" data-value="">--</button>
                <button type="button" class="custom-select-option" data-value="Mr">Mr.</button>
                <button type="button" class="custom-select-option" data-value="Ms">Ms.</button>
                <button type="button" class="custom-select-option" data-value="Mrs">Mrs.</button>
                <button type="button" class="custom-select-option" data-value="Dr">Dr.</button>
                <button type="button" class="custom-select-option" data-value="Mx">Mx.</button>
              </div>
              <input type="hidden" id="prefix" value="" />
            </div>
          </div>

          <div class="form-group flex-grow">
            <label for="first-name">First Legal Name *</label>
            <input type="text" id="first-name" class="form-input" required placeholder="e.g., Jane" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-grow">
            <label for="middle-name">Middle Name (Optional)</label>
            <input type="text" id="middle-name" class="form-input" placeholder="e.g., Marie" />
          </div>

          <div class="form-group flex-grow">
            <label for="last-name">Last Legal Name *</label>
            <input type="text" id="last-name" class="form-input" required placeholder="e.g., Doe" />
          </div>

          <div class="form-group suffix-group">
            <label for="suffix-trigger">Suffix</label>
            <div class="custom-select" data-target-input="suffix">
              <button type="button" id="suffix-trigger" class="custom-select-trigger form-input" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value">--</span>
                <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
              </button>
              <div class="custom-select-menu" role="listbox">
                <button type="button" class="custom-select-option" data-value="">--</button>
                <button type="button" class="custom-select-option" data-value="Jr">Jr.</button>
                <button type="button" class="custom-select-option" data-value="Sr">Sr.</button>
                <button type="button" class="custom-select-option" data-value="I">I</button>
                <button type="button" class="custom-select-option" data-value="II">II</button>
                <button type="button" class="custom-select-option" data-value="III">III</button>
                <button type="button" class="custom-select-option" data-value="IV">IV</button>
                <button type="button" class="custom-select-option" data-value="V">V</button>
                <button type="button" class="custom-select-option" data-value="VI">VI</button>
                <button type="button" class="custom-select-option" data-value="VII">VII</button>
                <button type="button" class="custom-select-option" data-value="VIII">VIII</button>
                <button type="button" class="custom-select-option" data-value="IX">IX</button>
                <button type="button" class="custom-select-option" data-value="X">X</button>
              </div>
              <input type="hidden" id="suffix" value="" />
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset class="form-section">
        <legend>Birthday</legend>

        <div class="form-row">
          <div class="form-group flex-grow">
            <label for="dob-month-trigger">Birth Date *</label>
            <div class="dob-selectors" id="dob-selectors">
              <div class="form-group flex-grow dob-part-group" data-part="month">
                <div class="custom-select" data-target-input="dob-month">
                  <button type="button" id="dob-month-trigger" class="custom-select-trigger form-input" aria-haspopup="listbox" aria-expanded="false">
                    <span class="custom-select-value">Month</span>
                    <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
                  </button>
                  <div class="custom-select-menu" role="listbox"></div>
                  <input type="hidden" id="dob-month" value="" />
                </div>
              </div>
              <div class="form-group flex-grow dob-part-group" data-part="day">
                <div class="custom-select" data-target-input="dob-day">
                  <button type="button" id="dob-day-trigger" class="custom-select-trigger form-input" aria-haspopup="listbox" aria-expanded="false">
                    <span class="custom-select-value">Day</span>
                    <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
                  </button>
                  <div class="custom-select-menu" role="listbox"></div>
                  <input type="hidden" id="dob-day" value="" />
                </div>
              </div>
              <div class="form-group flex-grow dob-part-group" data-part="year">
                <div class="custom-select" data-target-input="dob-year">
                  <button type="button" id="dob-year-trigger" class="custom-select-trigger form-input" aria-haspopup="listbox" aria-expanded="false">
                    <span class="custom-select-value">Year</span>
                    <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
                  </button>
                  <div class="custom-select-menu" role="listbox"></div>
                  <input type="hidden" id="dob-year" value="" />
                </div>
              </div>
            </div>
            <small id="dob-format-hint" class="dob-format-hint">Format: MM / DD / YYYY</small>
            <input type="hidden" id="dob" required />
            <span id="age-error" class="error-text" style="display:none; color:var(--mint-accent);">You must be 18+ to register as an adult.</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-grow">
            <label for="country-origin-trigger">Country of Origin *</label>
            <div class="custom-select" data-target-input="country-origin">
              <button type="button" id="country-origin-trigger" class="custom-select-trigger form-input" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value"><span class="fi fi-us"></span> United States</span>
                <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
              </button>
              <div class="custom-select-menu" role="listbox"></div>
              <input type="hidden" id="country-origin" value="US" required />
            </div>
          </div>
          <div class="form-group flex-grow">
            <label for="gender-trigger">Gender *</label>
            <div class="custom-select" data-target-input="gender">
              <button type="button" id="gender-trigger" class="custom-select-trigger form-input" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value">Select option</span>
                <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
              </button>
              <div class="custom-select-menu" role="listbox">
                <button type="button" class="custom-select-option" data-value="">Select option</button>
                <button type="button" class="custom-select-option" data-value="female">Female</button>
                <button type="button" class="custom-select-option" data-value="male">Male</button>
                <button type="button" class="custom-select-option" data-value="non-binary">Non-binary</button>
                <button type="button" class="custom-select-option" data-value="prefer-not-to-say">Prefer not to say</button>
              </div>
              <input type="hidden" id="gender" required value="" />
            </div>
          </div>
        </div>
      </fieldset>

      <div class="form-actions">
        <button type="button" id="back-btn" class="pill-button pill-button-mint">Back</button>
        <button type="submit" id="adult-submit-btn" class="pill-button pill-button-indigo" disabled>Next</button>
      </div>
    </form>
  </div>

  <script src="Sign Up Pt 2a Adult.js"></script>
</body>
</html>
