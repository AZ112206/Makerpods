<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makerpods | Adult Sign Up Pt 2b</title>
  <link rel="stylesheet" href="Sign Up Pt 2b Adult.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="../../../assets/css/site-logo.css" />
</head>
<body>
  <div class="site-logo" aria-label="Makerpods">
    <img src="../../../assets/images/makerpods-logo.png" alt="Makerpods" class="site-logo-img">
  </div>

  <div id="gear-toggle-container" class="gear-toggle-container">
    <div class="gear-options">
      <button id="theme-toggle-btn" class="gear-option-btn" aria-label="Toggle Dark/Light Mode">
        <span id="theme-icon"></span>
      </button>
      <button id="transparency-toggle-btn" class="gear-option-btn" aria-label="Toggle Solid/Transparent Mode">
        <span id="transparency-icon"></span>
      </button>
    </div>
    <button class="gear-main-btn" aria-label="Display settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="signup-container">
    <div class="signup-header">
      <h1>Adult Sign Up</h1>
      <p>Required for adults to view kids/students of all ages experience and work</p>
    </div>
    <!-- Adult Sign Up Form -->
    <form id="adult-signup-form" class="signup-form">
      <div class="form-group">
        <label for="adult-email">Email</label>
        <input type="email" id="adult-email" name="adult-email" required />
      </div>
      <div class="form-group">
        <label for="adult-password">Password</label>
        <div class="password-field">
          <input type="password" id="adult-password" name="adult-password" required />
          <button type="button" class="password-toggle" data-target="adult-password" aria-label="Show password" data-visible="false">
            <span class="icon-eye-off" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span>
            <span class="icon-eye" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></span>
          </button>
        </div>
        <div class="password-meter" aria-live="polite"><span class="password-meter-bar"><span class="password-meter-fill"></span></span><span class="password-meter-label">Enter a password</span></div>
        <div class="password-requirement" id="adult-password-requirement">
          <span class="requirement-icon">&#10005;</span>
          <span class="requirement-text">At least 8 characters</span>
        </div>
      </div>
      <div class="form-group">
        <label for="adult-confirm-password">Repeat Password</label>
        <div class="password-field">
          <input type="password" id="adult-confirm-password" name="adult-confirm-password" required />
          <button type="button" class="password-toggle" data-target="adult-confirm-password" aria-label="Show password" data-visible="false">
            <span class="icon-eye-off" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></span>
            <span class="icon-eye" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></span>
          </button>
        </div>
        <div class="password-requirement" id="adult-confirm-password-requirement">
          <span class="requirement-icon">&#10005;</span>
          <span class="requirement-text">Passwords must match</span>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" id="back-btn" class="pill-button pill-button-mint">Back</button>
        <button type="submit" id="adult-submit-btn" class="pill-button pill-button-indigo" disabled>Next</button>
      </div>
    </form>
  </div>

  <script src="Sign Up Pt 2b Adult.js"></script>
</body>
</html>
