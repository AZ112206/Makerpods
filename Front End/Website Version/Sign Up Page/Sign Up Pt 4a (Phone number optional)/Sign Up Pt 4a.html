<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makerpods | Phone Number (Optional)</title>
  <link rel="stylesheet" href="Sign Up Pt 4a.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css" />
  <link rel="stylesheet" href="../../assets/css/site-logo.css" />
</head>
<body>
  <div class="site-logo" aria-label="Makerpods">
    <img src="../../assets/images/makerpods-logo.png" alt="Makerpods" class="site-logo-img">
  </div>

  <div id="gear-toggle-container" class="gear-toggle-container">
    <div class="gear-options">
      <button id="theme-toggle-btn" class="gear-option-btn" aria-label="Toggle Dark/Light Mode">
        <span id="theme-icon"></span>
      </button>
      <button id="transparency-toggle-btn" class="gear-option-btn" aria-label="Toggle Solid/Transparent Mode">
        <span id="transparency-icon"></span>
      </button>
    </div>
    <button class="gear-main-btn" aria-label="Display settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="signup-container">
    <div class="signup-header">
      <h1>Enter Phone Number</h1>
      <p>Select your country code and enter your phone number to continue.</p>
    </div>

    <form id="phone-form" class="signup-form">
      <div class="form-group">
        <label>Phone Number (Optional)</label>
        <div class="phone-number-container" role="group" aria-label="Phone number sections">
          
          <!-- Country / Dial Code Dropdown -->
          <div class="phone-section phone-section-dropdown">
            <div class="custom-select" data-target-input="country-code">
              <button type="button" id="country-code-trigger" class="custom-select-trigger phone-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="custom-select-value"><span class="fi fi-us"></span> +1</span>
                <span class="custom-select-chevron" aria-hidden="true">&#9662;</span>
              </button>
              <div class="custom-select-menu" role="listbox"></div>
              <input type="hidden" id="country-code" value="+1" />
              <input type="hidden" id="country-iso" value="US" />
            </div>
          </div>

          <span class="phone-separator">(</span>

          <!-- Area Code Input Box -->
          <div class="phone-section phone-section-area">
            <input type="text" id="phone-area-code" class="phone-input" maxlength="3" inputmode="numeric" autocomplete="off" placeholder="555" />
          </div>

          <span class="phone-separator">)</span>

          <!-- Prefix Input Box -->
          <div class="phone-section phone-section-prefix">
            <input type="text" id="phone-prefix" class="phone-input" maxlength="3" inputmode="numeric" autocomplete="off" placeholder="555" />
          </div>

          <span class="phone-separator">-</span>

          <!-- Line Number Input Box -->
          <div class="phone-section phone-section-line">
            <input type="text" id="phone-line" class="phone-input" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="0123" />
          </div>

        </div>
      </div>

      <div class="form-actions">
        <button type="button" id="back-btn" class="pill-button pill-button-mint">Back</button>
        <button type="button" id="skip-btn" class="pill-button pill-button-secondary">Skip</button>
        <button type="submit" id="phone-submit-btn" class="pill-button pill-button-indigo">Next</button>
      </div>
    </form>
  </div>

  <script src="Sign Up Pt 4a.js"></script>
</body>
</html>
