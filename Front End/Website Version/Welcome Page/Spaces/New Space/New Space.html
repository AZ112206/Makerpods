<!-- New Space Modal Overlay -->
<div id="new-space-overlay" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Create New Space</h2>
      <button id="close-modal" class="close-button" aria-label="Close Modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <form id="create-space-form">
        <!-- Space Name -->
        <div class="form-group">
          <label for="space-name">Space Name</label>
          <input type="text" id="space-name" name="space-name" placeholder="Enter space name..." required />
        </div>

        <!-- Icon Selection -->
        <div class="form-group">
          <label>Select Icon</label>
          <div class="icon-grid">
            <div class="icon-option active" data-icon="robot">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </div>
            <div class="icon-option" data-icon="code">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </div>
            <div class="icon-option" data-icon="design">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 12l-7-7-3 3 7 7 3-3z"/><path d="M6 12l7-7 3 3-7 7-3-3z"/><path d="M12 12l-7-7-3 3 7 7 3-3z"/></svg>
            </div>
            <div class="icon-option" data-icon="science">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.8 12.8 0 0 1 3 7a14 14 0 0 1 5 4c1.1 0 2.1-.3 3-1"/><path d="m16 15 3-3a22 22 0 0 0-2-3.95A12.8 12.8 0 0 0 21 7a14 14 0 0 0-5 4c-1.1 0-2.1.3-3 1"/></svg>
            </div>
            <div class="icon-option" data-icon="music">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            <div class="icon-option" data-icon="game">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="4" y2="16"/><line x1="6" y1="12" x2="8" y2="16"/><line x1="6" y1="12" x2="6" y2="16"/><line x1="15" y1="12" x2="17" y2="16"/><line x1="15" y1="12" x2="13" y2="16"/><line x1="15" y1="12" x2="15" y2="16"/><line x1="21" y1="10" x2="21" y2="14"/><line x1="3" y1="10" x2="3" y2="14"/><rect x="3" y="8" width="18" height="8" rx="2"/></svg>
            </div>
            <div class="icon-option" data-icon="book">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </div>
            <div class="icon-option" data-icon="camera">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </div>
            <div class="icon-option" data-icon="heart">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l.14 1.82C4.5 13.5 4.5 16.5 12 19c7.5-2.5 7.5-5.5 7.5-5.5l.14-1.82a5.5 5.5 0 0 0-7.78-7.78z"/></svg>
            </div>
            <div class="icon-option" data-icon="globe">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            </div>
            <div class="icon-option" data-icon="idea">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/></svg>
            </div>
            <div class="icon-option" data-icon="coffee">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 15h14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/><line x1="14" y1="13" x2="14" y2="15"/></svg>
            </div>
            <div class="icon-option" data-icon="tool">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.77 3.77z"/></svg>
            </div>
            <div class="icon-option" data-icon="group">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="icon-option more-icons" title="More icons">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </div>
          </div>
        </div>

        <!-- Color Selection -->
        <div class="form-group">
          <label>Space Color</label>
          <div class="color-grid">
            <div class="color-option active" data-color="#6366f1" style="background-color: #6366f1;"></div>
            <div class="color-option" data-color="#10b981" style="background-color: #10b981;"></div>
            <div class="color-option" data-color="#0ea5e9" style="background-color: #0ea5e9;"></div>
            <div class="color-option" data-color="#f59e0b" style="background-color: #f59e0b;"></div>
            <div class="color-option" data-color="#ec4899" style="background-color: #ec4899;"></div>
            <div class="color-option" data-color="#8b5cf6" style="background-color: #8b5cf6;"></div>
            <div class="color-option" data-color="#ef4444" style="background-color: #ef4444;"></div>
            <div class="color-option" data-color="#f97316" style="background-color: #f97316;"></div>
            <div class="color-option" data-color="#fbbf24" style="background-color: #fbbf24;"></div>
            <div class="color-option" data-color="#a855f7" style="background-color: #a855f7;"></div>
            <div class="color-option" data-color="#64748b" style="background-color: #64748b;"></div>
            <div class="color-option" data-color="#22c55e" style="background-color: #22c55e;"></div>
            <div class="color-option" data-color="#06b6d4" style="background-color: #06b6d4;"></div>
            <div class="color-option" data-color="#f43f5e" style="background-color: #f43f5e;"></div>
          </div>
        </div>

        <!-- Privacy Settings -->
        <div class="form-group">
          <label>Privacy</label>
          <div class="privacy-toggle">
            <label class="toggle-option">
              <input type="radio" name="privacy" value="public" checked />
              <span class="toggle-label">Public</span>
            </label>
            <label class="toggle-option">
              <input type="radio" name="privacy" value="private" />
              <span class="toggle-label">Private</span>
            </label>
          </div>
        </div>

        <!-- Conditional Private Settings -->
        <div id="private-options" class="private-options-container hidden">
          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="ask-for-code" />
              <span>Ask for a code to join</span>
            </label>
          </div>

          <div id="code-input-group" class="form-group hidden">
            <label for="space-code">Access Code</label>
            <input type="text" id="space-code" name="space-code" maxlength="6" placeholder="6-digit code (e.g. A1B2C3)" />
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="create-btn">Create Space</button>
        </div>
      </form>
    </div>
  </div>
</div>
