<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makerpods - Customize Board</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../../../../assets/css/site-logo.css">
</head>
<body data-theme="dark">
  <header class="top-strip">
    <a href="../../Dashboard/space-dashboard.html" class="top-strip-logo">
      <img src="../../../../../assets/images/makerpods-logo.png" alt="Makerpods" class="top-strip-logo-img">
    </a>
    <div class="top-strip-actions">
      <a href="../Stick Notes Menu/index.html" class="back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Back to Notes</span>
      </a>
    </div>
  </header>

  <main class="dashboard">
    <div class="dashboard-body">
      <aside class="dashboard-sidebar">
        <div class="sidebar-profile">
          <div class="sidebar-profile-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="sidebar-profile-text">
            <span class="sidebar-profile-name">Alex Rivera</span>
            <span class="sidebar-profile-role">Customize Board</span>
          </div>
        </div>
        <nav class="dashboard-nav">
          <a class="dashboard-nav-item" href="../Add Stick Note Board/Your Note Boards/index.html" aria-label="Home">
            <span class="dashboard-nav-icon rose">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
            </span>
            <span class="dashboard-nav-label">Home</span>
          </a>
          <a class="dashboard-nav-item active" aria-label="Customize Board">
            <span class="dashboard-nav-icon rose">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.43-.25A2 2 0 0 1 5 4.18V4a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.43-.25A2 2 0 0 1 1 6.18V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6.18a2 2 0 0 1-1-1.73l-.43-.25a2 2 0 0 1-2 0l-.43.25A2 2 0 0 1 17 4.18V4a2 2 0 0 0-2-2h-.44z"/><circle cx="12" cy="13" r="3"/></svg>
            </span>
            <span class="dashboard-nav-label">Customize Board</span>
          </a>
        </nav>
      </aside>

      <section class="dashboard-panel">
        <div class="dashboard-panel-header">
          <h2>Customize Your Board</h2>
          <p>Change the look and feel of your space notes.</p>
        </div>

        <div class="customize-container">
          <div class="setting-card">
            <div class="setting-info">
              <h3>Board Background</h3>
              <p>Choose a background color for your board.</p>
            </div>
            <div class="setting-control">
              <label class="custom-color-option" title="Custom Color">
                <input type="color" id="bg-color-picker" value="#090D16">
                <span class="color-picker-swatch"></span>
              </label>
            </div>
          </div>

          <div class="setting-card">
            <div class="setting-info">
              <h3>Accent Color</h3>
              <p>Set the primary accent color for your notes.</p>
            </div>
            <div class="setting-control">
              <label class="custom-color-option" title="Custom Color">
                <input type="color" id="accent-color-picker" value="#6366F1">
                <span class="color-picker-swatch"></span>
              </label>
            </div>
          </div>

          <button id="save-settings" class="save-btn">Save Changes</button>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
