<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makerpods - Stick Note Boards</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../../../../../assets/css/site-logo.css">
</head>
<body data-theme="dark">

  <header class="top-strip">
    <a href="../../../../Space Menu/spaces.html" class="top-strip-logo" aria-label="Back to Spaces">
      <img src="../../../../../../assets/images/makerpods-logo.png" alt="Makerpods" class="top-strip-logo-img">
    </a>
    <form class="top-strip-search" role="search" aria-label="Search Space">
      <span class="top-strip-search-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="search" class="top-strip-search-input" id="board-search" placeholder="Search boards..." aria-label="Search Space" />
    </form>
  </header>

  <main class="dashboard">
    <div class="dashboard-body">
      <aside class="dashboard-sidebar">
        <div class="sidebar-profile">
          <div class="sidebar-profile-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="sidebar-profile-text">
            <span class="sidebar-profile-name">Alex Rivera</span>
            <span class="sidebar-profile-role">Space Boards</span>
          </div>
        </div>
        <nav class="dashboard-nav">
          <a class="dashboard-nav-item" href="../../../Dashboard/space-dashboard.html">
            <span class="dashboard-nav-icon rose">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
            </span>
            <span class="dashboard-nav-label">Home</span>
          </a>
          <a class="dashboard-nav-item active">
            <span class="dashboard-nav-icon mint">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v4"/><path d="M9 3v4"/></svg>
            </span>
            <span class="dashboard-nav-label">Stick Note Boards</span>
          </a>
          <a class="dashboard-nav-item" href="../Recently deleted/index.html">
            <span class="dashboard-nav-icon rose">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </span>
            <span class="dashboard-nav-label">Recently Deleted</span>
          </a>
        </nav>
      </aside>

      <section class="dashboard-panel">
        <div class="dashboard-panel-header">
          <h2 id="panel-title">Your Note Boards</h2>
          <p>Organize your thoughts into themed boards.</p>
        </div>

        <div class="dashboard-panel-body">
          <div class="spaces-section">
            <div class="spaces-bento-grid" id="boards-list">
              <div class="bento-add-space" id="open-create-board">
                <div class="add-space-circle">
                  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </div>
                <span class="add-space-label">Create Stick Note Board</span>
              </div>
              <!-- Boards will be injected here -->
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- Create Board Modal -->
  <div id="create-board-modal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Create New Board</h2>
        <button id="close-modal" class="close-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <form id="create-board-form">
          <div class="form-group">
            <label for="board-name">Board Name</label>
            <input type="text" id="board-name" placeholder="e.g. Project Ideas" required>
          </div>
          <div class="form-group">
            <label>Board Color</label>
            <div class="color-grid">
              <div class="color-option active" data-color="#6366f1" style="background-color: #6366f1;"></div>
              <div class="color-option" data-color="#10b981" style="background-color: #10b981;"></div>
              <div class="color-option" data-color="#0ea5e9" style="background-color: #0ea5e9;"></div>
              <div class="color-option" data-color="#f59e0b" style="background-color: #f59e0b;"></div>
              <div class="color-option" data-color="#ec4899" style="background-color: #ec4899;"></div>
              <div class="color-option" data-color="#8b5cf6" style="background-color: #8b5cf6;"></div>
              <div class="color-option" data-color="#FACC15" style="background-color: #FACC15;"></div>
              <div class="color-option" data-color="#ef4444" style="background-color: #ef4444;"></div>
              <label class="color-option custom-color-option" data-color="#a855f7" title="Choose a custom color" aria-label="Choose a custom color">
                <input type="color" value="#a855f7" aria-label="Choose a custom board color" />
                <span class="color-picker-swatch"></span>
              </label>
            </div>
          </div>
          <div class="form-footer">
            <button type="submit" class="create-btn">Create Board</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
