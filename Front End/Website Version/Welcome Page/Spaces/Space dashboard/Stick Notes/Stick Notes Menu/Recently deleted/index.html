<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makerpods - Recently Deleted Notes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../../../../../assets/css/site-logo.css">
</head>
<body data-theme="dark">

  <header class="top-strip">
    <a href="../../../Dashboard/space-dashboard.html" class="top-strip-logo">
      <img src="../../../../../../assets/images/makerpods-logo.png" alt="Makerpods" class="top-strip-logo-img">
    </a>
    <div class="top-strip-actions">
      <div class="board-search-container">
        <span class="search-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="board-search" placeholder="Search deleted notes...">
      </div>
    </div>
  </header>

  <main class="dashboard">
    <div class="dashboard-body">
      <aside class="dashboard-sidebar">
        <div class="sidebar-profile">
          <div class="sidebar-profile-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="sidebar-profile-text">
            <span class="sidebar-profile-name">Alex Rivera</span>
            <span class="sidebar-profile-role">Deleted Notes</span>
          </div>
        </div>
        <nav class="dashboard-nav">
          <a class="dashboard-nav-item" href="../index.html">
            <span class="dashboard-nav-icon rose">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
            </span>
            <span class="dashboard-nav-label">Home</span>
          </a>
          <a class="dashboard-nav-item active">
            <span class="dashboard-nav-icon rose">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </span>
            <span class="dashboard-nav-label">Recently Deleted</span>
          </a>
        </nav>
      </aside>

      <section class="dashboard-panel">
        <div class="dashboard-panel-header">
          <h2 id="panel-title">Recently Deleted Notes</h2>
          <p>Recover your deleted notes or remove them permanently.</p>
        </div>

        <div class="dashboard-panel-body">
          <div class="spaces-section">
            <div class="notes-grid" id="deleted-notes-grid">
              <!-- Deleted notes will be injected here -->
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
