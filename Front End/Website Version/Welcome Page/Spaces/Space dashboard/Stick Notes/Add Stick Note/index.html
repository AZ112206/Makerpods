<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makerpods - New Stick Note</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../../../../assets/css/sidebar.css">
  <link rel="stylesheet" href="../../../../../assets/css/site-logo.css">
</head>
<body data-theme="dark">

  <header class="top-strip">
    <a href="../../Dashboard/space-dashboard.html" class="top-strip-logo">
      <img src="../../../../../assets/images/makerpods-logo.png" alt="Makerpods" class="top-strip-logo-img">
    </a>
    <div class="top-strip-actions">
      <a href="../Stick Notes Menu/index.html" class="cancel-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        <span>Cancel</span>
      </a>
      <button id="save-note-btn" class="save-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>Save Note</span>
      </button>
    </div>
  </header>

  <main class="dashboard">
    <div class="dashboard-body">
      <aside class="dashboard-sidebar">
        <div class="sidebar-profile">
          <div class="sidebar-profile-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="sidebar-profile-text">
            <span class="sidebar-profile-name">Alex Rivera</span>
            <span class="sidebar-profile-role">Space Notes</span>
          </div>
        </div>
        <nav class="dashboard-nav">
          <a class="dashboard-nav-item" href="../../Dashboard/space-dashboard.html" aria-label="Home">
            <span class="dashboard-nav-icon rose">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
            </span>
            <span class="dashboard-nav-label">Home</span>
          </a>

          <a class="dashboard-nav-item" href="../../Dashboard/space-dashboard.html#panel-messages" aria-label="Messages">
            <span class="dashboard-nav-icon sky">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </span>
            <span class="dashboard-nav-label">Messages</span>
          </a>

          <a class="dashboard-nav-item active" href="../Stick Notes Menu/index.html" aria-label="Stick Notes">
            <span class="dashboard-nav-icon mint">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v4"/><path d="M9 3v4"/></svg>
            </span>
            <span class="dashboard-nav-label">Stick Notes</span>
          </a>

          <a class="dashboard-nav-item" href="../../Dashboard/space-dashboard.html#panel-white-board" aria-label="White board">
            <span class="dashboard-nav-icon sky">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 3v18"/></svg>
            </span>
            <span class="dashboard-nav-label">White board</span>
          </a>

          <a class="dashboard-nav-item" href="../../../Settings/Settings Menus/Adult Settings Menu/Unverified/Settings.html" aria-label="Settings">
            <span class="dashboard-nav-icon violet">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </span>
            <span class="dashboard-nav-label">Settings</span>
          </a>
        </nav>
      </aside>

      <section class="editor-panel">
        <div class="editor-container">
          <div class="stick-note-editor note-mint" id="note-canvas">
            <div class="color-picker">
              <button class="color-dot mint active" data-color="mint"></button>
              <button class="color-dot sky" data-color="sky"></button>
              <button class="color-dot indigo" data-color="indigo"></button>
              <button class="color-dot violet" data-color="violet"></button>
              <button class="color-dot rose" data-color="rose"></button>
              <button class="color-dot yellow" data-color="yellow" style="background-color: #FFFF88;"></button>
              <button class="color-dot pink" data-color="pink" style="background-color: #FFB6C1;"></button>
              <button class="color-dot green" data-color="green" style="background-color: #BFFBBE;"></button>
              <button class="color-dot blue" data-color="blue" style="background-color: #BBEBFF;"></button>
              <button class="color-dot orange" data-color="orange" style="background-color: #FFCC88;"></button>
              <label class="color-dot custom-color-option" title="Custom Color">
                <input type="color" id="custom-color-input" value="#FFFF00" style="opacity: 0; width: 100%; height: 100%; cursor: pointer;">
                <span class="color-swatch" style="position: absolute; inset: 0; background: #FFFF00;"></span>
              </label>
            </div>
            <textarea id="note-text" placeholder="Write your note here..."></textarea>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
