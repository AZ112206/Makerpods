<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Density Settings</title>
    <link rel="stylesheet" href="Layout Density.css">
</head>
<body>

    <div class="settings-container">
        <div class="setting-item" id="layoutDensityToggle">
            <span class="setting-label">Layout Density</span>
            <span class="current-value" id="currentLayoutDensity">Comfortable</span>
        </div>
        <div class="options-container" id="optionsContainer">
            <div class="option selected" data-density="comfortable" data-label="Comfortable">
                <span>Comfortable</span>
            </div>
            <div class="option" data-density="compact" data-label="Compact">
                <span>Compact</span>
            </div>
        </div class="option" data-density="spacious" data-label="Spacious">
                <span>Spacious</span>
            </div>
        <div class="option" data-density="custom" data-label="Custom">
                <span>Custom</span>
            </div> 
        </div>
</html>
