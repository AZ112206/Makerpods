<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter your parent's code — Makerpods</title>
  <link rel="stylesheet" href="../../../assets/css/site-logo.css" />
  <link rel="stylesheet" href="Student Code link.css" />
</head>
<body data-role="student">
  <div class="site-logo" aria-label="Makerpods">
    <img src="../../../assets/images/makerpods-logo.png" alt="Makerpods" class="site-logo-img">
  </div>

  <main class="scan-card" data-step="manual-code">
    <p class="eyebrow">Link a Parent</p>
    <h1>Enter your parent's code</h1>
    <p class="scan-lede">
      Type the link code your parent gave you, plus their name. We'll match
      it to their Makerpods profile and send them a request to confirm the
      link.
    </p>

    <form class="manual-form" id="manual-form" novalidate>
      <label class="manual-field">
        <span class="manual-field-label">Parent's link code</span>
        <input
          type="text"
          id="code-input"
          name="code"
          class="scan-form-input"
          maxlength="14"
          inputmode="latin"
          pattern="[A-Za-z0-9\-]+"
          placeholder="ABC123"
          spellcheck="false"
          autocapitalize="characters"
          required
        />
      </label>

      <label class="manual-field">
        <span class="manual-field-label">Parent's name</span>
        <input
          type="text"
          id="parent-name"
          name="parentName"
          class="scan-form-input manual-name-input"
          placeholder="e.g. Jordan Rivera"
          autocomplete="off"
          required
        />
      </label>
    </form>

    <p class="scan-help">No camera needed — type the code exactly as it appears on their device.</p>

    <div class="scan-error" id="scan-error" role="alert" hidden></div>

    <div class="scan-actions">
      <button type="submit" form="manual-form" id="confirm-btn" class="btn-primary">Link</button>
      <button type="button" id="cancel-btn" class="btn-back">Back</button>
      <a class="btn-link" href="../Student QR scan/Student QR scan.html">Use camera instead</a>
    </div>
  </main>

  <script src="Student Code link.js"></script>
</body>
</html>
