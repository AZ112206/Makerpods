<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parent Mode — Enter Code</title>
  <link rel="stylesheet" href="../../../assets/css/site-logo.css" />
  <link rel="stylesheet" href="Parent QR scan.css" />
</head>
<body data-role="parent">
  <div class="site-logo" aria-label="Makerpods">
    <img src="../../../assets/images/makerpods-logo.png" alt="Makerpods" class="site-logo-img">
  </div>

  <main class="verify-card" data-step="code">
    <a class="back-link" href="Parent QR scan.html" aria-label="Back to QR">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Back to QR</span>
    </a>

    <div class="verify-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2H10a2 2 0 0 0-2 2v6h2V4h11v16H10v-6H8v6a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z" />
        <path d="M3 8h6v8H3z" />
      </svg>
    </div>

    <p class="eyebrow">Parent Mode</p>
    <h1>Enter the code</h1>
    <p class="verify-lede">
      Type the link code your son or daughter gave you and their name. We'll
      match it to their Makerpods profile and add you as their parent.
    </p>

    <form class="code-form" id="code-form" novalidate>
      <label class="code-field">
        <span class="code-field-label">Link code</span>
        <input type="text" id="code-input" name="code" placeholder="e.g. MP-A7K2-93QX" autocomplete="off" required />
      </label>

      <label class="code-field">
        <span class="code-field-label">Son or daughter's name</span>
        <input type="text" id="student-name" name="studentName" placeholder="e.g. Mia Rivera" autocomplete="off" required />
      </label>
    </form>

    <div class="verify-actions">
      <button type="submit" form="code-form" id="confirm-btn" class="btn-primary">Confirm</button>
      <button type="button" id="cancel-btn" class="btn-back">Cancel</button>
      <a class="btn-link" href="Parent QR scan.html">Use camera instead</a>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("code-form");
      const codeInput = document.getElementById("code-input");
      const nameInput = document.getElementById("student-name");
      const cancelBtn = document.getElementById("cancel-btn");

      if (form) {
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const code = codeInput.value.trim();
          const name = nameInput.value.trim();
          if (!code || !name) {
            if (!code) codeInput.focus();
            else nameInput.focus();
            return;
          }
          try {
            localStorage.setItem("makerpodsParentModeLinked", "true");
            localStorage.setItem(
              "makerpodsLinkedStudent",
              JSON.stringify({ id: code, name: name, linkedAt: Date.now() })
            );
          } catch (e) { /* ignore */ }
          window.location.href = "../../../Dashboard/Adult Dashboard/Adult Dashboard.html";
        });
      }

      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          window.location.href = "../Settings Menus/Parent Settings Menu/Settings.html";
        });
      }
    });
  </script>
</body>
</html>
