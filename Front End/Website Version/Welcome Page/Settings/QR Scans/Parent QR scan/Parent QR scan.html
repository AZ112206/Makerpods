<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parent Mode — Your QR code</title>
  <link rel="stylesheet" href="../../../assets/css/site-logo.css" />
  <link rel="stylesheet" href="Parent QR scan.css" />
</head>
<body data-role="parent">
  <div class="site-logo" aria-label="Makerpods">
    <img src="../../../assets/images/makerpods-logo.png" alt="Makerpods" class="site-logo-img">
  </div>

  <main class="verify-card" data-step="qr">
    <a class="back-link" href="../Settings Menus/Parent Settings Menu/Settings.html" aria-label="Back to settings">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span>Back to Settings</span>
    </a>

    <div class="verify-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1" />
        <rect x="14" y="3" width="7" height="7" rx="1" />
        <rect x="3" y="14" width="7" height="7" rx="1" />
        <line x1="14" y1="14" x2="14" y2="17" />
        <line x1="14" y1="20" x2="17" y2="20" />
        <line x1="20" y1="14" x2="20" y2="20" />
        <line x1="14" y1="20" x2="14" y2="20" />
        <line x1="17" y1="17" x2="17" y2="17" />
        <line x1="20" y1="17" x2="20" y2="20" />
        <line x1="17" y1="20" x2="17" y2="20" />
      </svg>
    </div>

    <p class="eyebrow">Parent Mode</p>
    <h1>Your QR code</h1>
    <p class="verify-lede">
      Have your son or daughter scan this code in their Makerpods profile to
      add you as their parent. They'll see your name and request approval.
    </p>

    <!-- Hero: parent's own scannable QR -->
    <section class="qr-show" aria-label="Your parent QR code">
      <div id="self-qr" class="qr-canvas" role="img" aria-label="Your personal parent link QR code"></div>
      <p class="qr-caption">Open your camera app and point it at this code.</p>
    </section>

    <div class="verify-actions">
      <button type="button" id="open-camera-btn" class="btn-primary">
        <span class="btn-primary-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </span>
        Scan your son or daughter's QR
      </button>
      <button type="button" id="cancel-btn" class="btn-back">Cancel</button>
      <a class="btn-link" href="Code link.html">Enter code manually</a>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="Parent QR scan.js"></script>
</body>
</html>
